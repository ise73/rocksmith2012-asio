; RS_ASIO configuration for Rocksmith (2011) on native Windows.
; Rename this file to RS_ASIO.ini and put it next to Rocksmith.exe,
; together with avrt.dll and RS_ASIO.dll.
; Rocksmith.ini must contain ExclusiveMode=1 in the [Audio] section.

[Config]
EnableWasapiOutputs=0
; Required for Rocksmith 2011 (set to 1)
EnableWasapiInputs=1
EnableAsio=1

[Asio]
; available buffer size modes:
; driver - respect buffer size setting set in the driver (recommended)
; host   - use a buffer size as close as possible as that requested by the host application
; custom - use the buffer size specified in CustomBufferSize field
BufferSizeMode=driver
CustomBufferSize=

; Rocksmith 2011 polls the audio device (~every 10ms) instead of waiting for it.
; With the ring buffer enabled, the ASIO buffer in your driver's control panel can be
; small (128-256) without crackling. Set to 0 to use the old double-buffer behaviour,
; which needs a large driver buffer (512).
EnablePollingRingBuffer=1
; Size of that ring buffer in frames. Empty or 0 = automatic.
; Smaller = less latency, but too small brings crackling back.
PollingBufferSize=

[Asio.Output]
; name of your ASIO driver, exactly as listed in RS_ASIO.log under "AsioHelpers::FindDrivers"
Driver=Yamaha Steinberg USB ASIO
BaseChannel=0
AltBaseChannel=
EnableSoftwareEndpointVolumeControl=1
EnableSoftwareMasterVolumeControl=1
SoftwareMasterVolumePercent=100
EnableRefCountHack=

[Asio.Input.0]
Driver=Yamaha Steinberg USB ASIO
; input your guitar is plugged into, starting at 0 (e.g. UR12 Hi-Z input = 1)
Channel=1
; the Real Tone Cable is currently still required to be plugged in; the game opens
; it by this name and RS_ASIO redirects it to the ASIO input above
WasapiDevice=Rocksmith
EnableSoftwareEndpointVolumeControl=1
EnableSoftwareMasterVolumeControl=1
SoftwareMasterVolumePercent=100
EnableRefCountHack=
