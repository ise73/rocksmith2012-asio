name: Build

on:
  # Every push builds the DLLs and attaches them to the run as a downloadable artifact.
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'release-*'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  SOLUTION_FILE_PATH: RS_ASIO.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x86

jobs:
  build:
    runs-on: windows-2022

    permissions:
      contents: write

    steps:
    - name: Checkout current build target
      uses: actions/checkout@v6

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Build with MSBuild
      run: msbuild '${{ env.SOLUTION_FILE_PATH }}' /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}

    - name: Stage package
      shell: pwsh
      run: |
        $stagingName = "$env:GITHUB_REPOSITORY".Split('/')[1]
        mkdir $stagingName
        copy "bin\Win32\${{ env.BUILD_CONFIGURATION }}\RS_ASIO.dll" "$stagingName\"
        copy "bin\Win32\${{ env.BUILD_CONFIGURATION }}\avrt.dll" "$stagingName\"
        copy "assets\RS_ASIO.ini" "$stagingName\"
        copy "README.md" "$stagingName\"
        copy "LICENSE" "$stagingName\"
        mkdir "$stagingName\linux"
        copy "assets\RS_ASIO-linux.ini" "$stagingName\linux\RS_ASIO.ini"
        copy "assets\rocksmith-on-linux.sh" "$stagingName\linux\"
        copy "assets\pipeasio-register" "$stagingName\linux\"
        copy "docs\setup-guide.md" "$stagingName\linux\"
        "STAGING_NAME=$stagingName" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.STAGING_NAME }}-${{ github.sha }}
        path: ${{ env.STAGING_NAME }}/

    - name: Create release zip
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      shell: pwsh
      run: Compress-Archive -Path "$env:STAGING_NAME\*" -DestinationPath "$env:STAGING_NAME-$env:GITHUB_REF_NAME.zip"

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: ${{ env.STAGING_NAME }}-*.zip
